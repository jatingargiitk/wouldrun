[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wouldrun"
version = "0.1.0"
description = "Will this push or PR trigger my GitHub Actions workflows, and if not, which filter stopped it?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.1"]
authors = [{ name = "Jatin Garg" }]
keywords = ["github-actions", "ci", "workflow", "path-filter"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
wouldrun = "wouldrun.cli:main"

[tool.setuptools]
packages = ["wouldrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
